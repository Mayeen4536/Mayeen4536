<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
  <title id="title">Mayeen's Curiosity Den</title>
  <desc id="desc">Curiosity lives here. Mayeen Abedin Sajid, Senior Software QA Engineer in Dhaka. An orbiting constellation of questions, code, and evidence surrounds a glowing idea. A tiny robot keeps watch. Come for the code. Stay for the questions.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#253740"/></pattern>
    <radialGradient id="halo"><stop stop-color="#7DE2CB" stop-opacity=".13"/><stop offset="1" stop-color="#7DE2CB" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: Consolas, 'Liberation Mono', monospace; }
    .orbit { transform-origin: 763px 220px; animation: orbit 38s linear infinite; }
    .reverse { animation-direction: reverse; animation-duration: 50s; }
    .breathe { animation: breathe 5s ease-in-out infinite; }
    .spark { animation: sparkle 6s ease-in-out infinite; }
    .spark-late { animation-delay: -3s; }
    .cursor { animation: blink 1.4s steps(1) infinite; }
    .robot { animation: bob 5s ease-in-out infinite; }
    .eyes { transform-origin: 852px 358px; animation: eyes 7s infinite; }
    .signal { stroke-dasharray: 5 11; animation: signal 6s linear infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes breathe { 0%,100% { opacity:.45; } 50% { opacity:1; } }
    @keyframes sparkle { 0%,100% { opacity:.35; } 50% { opacity:1; } }
    @keyframes blink { 0%,65% { opacity:1; } 66%,100% { opacity:0; } }
    @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-5px); } }
    @keyframes eyes { 0%,43%,47%,100% { transform:scaleY(1); } 45% { transform:scaleY(.12); } }
    @keyframes signal { to { stroke-dashoffset:-64; } }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>

  <rect x="1" y="1" width="998" height="478" rx="24" fill="#101B23" stroke="#30434B"/>
  <rect x="1" y="1" width="998" height="478" rx="24" fill="url(#grid)"/>
  <path d="M40 76H960 M40 419H960" stroke="#30434B"/>
  <circle cx="48" cy="43" r="5" fill="#7DE2CB" class="breathe"/>
  <text x="64" y="48" class="mono" font-size="13" letter-spacing="2" fill="#F1EEE5">MAYEEN / THE CURIOSITY DEN</text>
  <text x="955" y="48" text-anchor="end" class="mono" font-size="12" letter-spacing="1" fill="#A8BCC1">EST. IN DHAKA · OPEN TO IDEAS</text>

  <text x="48" y="124" class="mono" font-size="13" letter-spacing="2" fill="#7DE2CB">HELLO, FELLOW EXPLORER.</text>
  <text x="44" y="207" font-size="76" font-weight="750" letter-spacing="-3" fill="#F1EEE5">Curiosity</text>
  <text x="44" y="289" font-size="76" font-weight="750" letter-spacing="-3" fill="#F1EEE5">lives here<tspan fill="#F6B77D">.</tspan></text>
  <path d="M49 309 Q172 300 292 309" stroke="#F6B77D" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="48" y="353" font-size="23" font-weight="600" fill="#F1EEE5">Mayeen Abedin Sajid</text>
  <text x="48" y="383" font-size="16" fill="#A8BCC1">Senior Software QA Engineer · Builder · Bug detective</text>

  <!-- The idea observatory: decorative motion, never a live status indicator. -->
  <circle cx="763" cy="220" r="183" fill="url(#halo)" class="breathe"/>
  <g fill="none" stroke="#30434B">
    <circle cx="763" cy="220" r="132"/>
    <circle cx="763" cy="220" r="97" stroke-dasharray="3 8"/>
    <path d="M599 220H927 M763 65V374" stroke-dasharray="2 8"/>
    <ellipse cx="763" cy="220" rx="161" ry="63" transform="rotate(-32 763 220)"/>
  </g>
  <g class="orbit"><circle cx="763" cy="88" r="6" fill="#7DE2CB"/><circle cx="763" cy="352" r="4" fill="#F6B77D"/></g>
  <g class="orbit reverse"><circle cx="860" cy="220" r="4" fill="#F6B77D"/></g>
  <g class="spark" fill="#F6B77D"><path d="M909 119v16m-8-8h16" stroke="#F6B77D" stroke-width="2"/><circle cx="595" cy="167" r="3"/></g>
  <g class="spark spark-late" stroke="#7DE2CB" stroke-width="2"><path d="M638 317v12m-6-6h12 M911 284v12m-6-6h12"/></g>

  <circle cx="763" cy="220" r="60" fill="#15252E" stroke="#7DE2CB" stroke-opacity=".5"/>
  <circle cx="763" cy="220" r="51" fill="none" stroke="#30434B"/>
  <g fill="none" stroke="#7DE2CB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M746 223c-16-16-4-40 17-40s33 24 17 40c-5 5-7 9-7 15h-20c0-6-2-10-7-15Z"/>
    <path d="M754 245h18m-14 7h10m-5-15v-24m-7-6 7 7 7-7"/>
    <path d="M763 171v-7m-35 20-5-5m-5 30h-7m87-25 5-5m5 30h7" class="breathe"/>
  </g>

  <g class="mono" font-size="12" letter-spacing="1">
    <rect x="588" y="100" width="117" height="32" rx="16" fill="#15252E" stroke="#30434B"/>
    <text x="646" y="121" text-anchor="middle" fill="#7DE2CB" class="mono">WHAT IF?</text>
    <rect x="847" y="188" width="113" height="32" rx="16" fill="#15252E" stroke="#30434B"/>
    <text x="903" y="209" text-anchor="middle" fill="#F1EEE5" class="mono">LET'S BUILD</text>
    <rect x="604" y="277" width="112" height="32" rx="16" fill="#15252E" stroke="#30434B"/>
    <text x="660" y="298" text-anchor="middle" fill="#F1EEE5" class="mono">PROVE IT.</text>
  </g>

  <path d="M754 334v41h63" fill="none" stroke="#7DE2CB" stroke-opacity=".5" class="signal"/>
  <g class="robot">
    <path d="M852 328v10" stroke="#A8BCC1" stroke-width="2"/>
    <circle cx="852" cy="326" r="4" fill="#F6B77D" class="breathe"/>
    <rect x="822" y="338" width="60" height="41" rx="13" fill="#15252E" stroke="#A8BCC1" stroke-width="1.5"/>
    <g class="eyes" fill="#7DE2CB"><rect x="834" y="352" width="8" height="9" rx="4"/><rect x="862" y="352" width="8" height="9" rx="4"/></g>
    <path d="M847 368q5 4 10 0" fill="none" stroke="#A8BCC1" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M833 386h38m-32-6v6m26-6v6" stroke="#A8BCC1" stroke-width="2" stroke-linecap="round"/>
    <path d="M885 356l8-7 3-9" stroke="#F6B77D" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <text x="48" y="452" class="mono" font-size="13" fill="#A8BCC1">&gt; come for the code. stay for the questions.</text>
  <rect x="426" y="440" width="8" height="15" rx="1" fill="#7DE2CB" class="cursor"/>
  <text x="953" y="452" text-anchor="end" class="mono" font-size="12" fill="#A8BCC1">SCROLL TO EXPLORE ↓</text>
</svg>
