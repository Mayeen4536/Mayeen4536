<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="152" viewBox="0 0 1000 152" role="img" aria-labelledby="title desc">
  <title id="title">Notes from the desk</title>
  <desc id="desc">Three rotating desk notes: A passing test answers a question. Curiosity asks a better one. Make room for the strange idea. Then build a way to test it. Leave the code clearer, the product kinder, and the next person a clue.</desc>
  <style>
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: Consolas, 'Liberation Mono', monospace; }
    .note { animation-duration:24s; animation-timing-function:linear; animation-iteration-count:infinite; }
    .one { animation-name:first; }
    .two { opacity:0; animation-name:second; }
    .three { opacity:0; animation-name:third; }
    @keyframes first { 0%,29%,100% { opacity:1; } 33%,95% { opacity:0; } }
    @keyframes second { 0%,29%,66%,100% { opacity:0; } 33%,62% { opacity:1; } }
    @keyframes third { 0%,62%,100% { opacity:0; } 66%,95% { opacity:1; } }
    @media (prefers-reduced-motion: reduce) { .note { animation:none; } .one { opacity:1; } .two,.three { opacity:0; } }
  </style>
  <rect x="1" y="1" width="998" height="150" rx="16" fill="#F6F3EB" stroke="#C7D5CF"/>
  <path d="M29 28v96" stroke="#9B4924" stroke-width="3" stroke-linecap="round"/>
  <text x="52" y="36" class="mono" font-size="12" letter-spacing="2" fill="#506970">NOTES FROM THE DESK / A LITTLE FUEL FOR YOUR NEXT IDEA</text>
  <g class="note one">
    <text x="52" y="80" font-size="27" font-weight="600" fill="#17343B">A passing test answers a question.</text>
    <text x="52" y="116" font-size="27" fill="#126956">Curiosity asks a better one.</text>
    <text x="949" y="118" text-anchor="end" class="mono" font-size="13" fill="#506970">01 / 03</text>
  </g>
  <g class="note two">
    <text x="52" y="80" font-size="27" font-weight="600" fill="#17343B">Make room for the strange idea.</text>
    <text x="52" y="116" font-size="27" fill="#126956">Then build a way to test it.</text>
    <text x="949" y="118" text-anchor="end" class="mono" font-size="13" fill="#506970">02 / 03</text>
  </g>
  <g class="note three">
    <text x="52" y="80" font-size="27" font-weight="600" fill="#17343B">Leave the code clearer, the product kinder,</text>
    <text x="52" y="116" font-size="27" fill="#126956">and the next person a clue.</text>
    <text x="949" y="118" text-anchor="end" class="mono" font-size="13" fill="#506970">03 / 03</text>
  </g>
</svg>
