<svg xmlns="http://www.w3.org/2000/svg" width="720" height="112" viewBox="0 0 720 112" role="img" aria-labelledby="title desc">
  <title id="title">The gadget drawer</title>
  <desc id="desc">A few tools. A lot of what-ifs.. Open this card to read a short note.</desc>
  <style>
    text { font-family:'Segoe UI',Helvetica,Arial,sans-serif; }
    .float { animation:float 4s ease-in-out infinite; }
    .trace { stroke-dasharray:4 8; animation:trace 8s linear infinite; }
    .pulse { animation:pulse 4s ease-in-out infinite; }
    .turn { transform-origin:56px 56px; animation:turn 24s linear infinite; }
    @keyframes float { 0%,100% { transform:translateY(2px); } 50% { transform:translateY(-3px); } }
    @keyframes trace { to { stroke-dashoffset:-96; } }
    @keyframes pulse { 0%,100% { opacity:.35; } 50% { opacity:.9; } }
    @keyframes turn { to { transform:rotate(360deg); } }
    @media(max-width:400px) {
      .card-title { font-size:40px; transform:translateY(16px); }
      .card-subtitle { display:none; }
    }
    @media(prefers-reduced-motion:reduce) { * { animation:none !important; } }
  </style>
  <rect x="1" y="1" width="718" height="110" rx="18" fill="#F6F3EB" stroke="#C7D5CF"/>
  <rect x="1" y="1" width="718" height="110" rx="18" fill="#24618C" fill-opacity=".055"/>
  <path d="M19 30v52" stroke="#24618C" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="56" r="31" fill="#24618C" fill-opacity=".10"/>
  <g transform="translate(8 0)" fill="none" stroke="#24618C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g class="turn"><ellipse cx="56" cy="56" rx="26" ry="11"/><ellipse cx="56" cy="56" rx="26" ry="11" transform="rotate(60 56 56)"/><ellipse cx="56" cy="56" rx="26" ry="11" transform="rotate(120 56 56)"/></g><circle cx="56" cy="56" r="4" fill="#24618C"/></g>
  <text class="card-title" x="116" y="48" font-size="28" font-weight="650" fill="#17343B">The gadget drawer</text>
  <text class="card-subtitle" x="116" y="79" font-size="18" fill="#506970">A few tools. A lot of what-ifs.</text>
  <path d="M570 56h45" stroke="#24618C" stroke-opacity=".5" class="trace"/>
  <circle cx="658" cy="56" r="22" fill="#FFFCF5" stroke="#24618C" stroke-opacity=".5"/>
  <path d="M650 56h16m-8-8v16" stroke="#24618C" stroke-width="2" stroke-linecap="round"/>
</svg>
